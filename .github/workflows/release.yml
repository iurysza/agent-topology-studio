name: Release

# Publishes to npm when a GitHub release is published. Off unless the repository variable RELEASE_AUTOMATION_ENABLED is
# 'true' and this is the intended public repository. npm trusted publishing (OIDC) signs in; there is no npm token.
# A private repository can still publish; npm only generates provenance for public repositories.
# scripts/check-release.js still blocks the publish while package.json is private or UNLICENSED.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  check:
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true' && github.repository == 'iurysza/agent-topology-studio' && !github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later. Node 22.18.0 ships npm 10.
      - name: Pin npm
        run: npm install -g npm@11.16.0

      - name: Check the tag is on main
        # fetch-depth: 0 already fetched origin/main; no second fetch, which would need stored credentials.
        run: |
          git merge-base --is-ancestor "$(git rev-parse "refs/tags/$TAG^{commit}")" origin/main

      - name: Check release policy
        run: node scripts/check-release.js --tag "$TAG" --repository "$REPOSITORY"

      - name: Install
        run: npm ci

      # prepack builds dist/ and web/dist/ inside npm publish.
      # Provenance only from a public repository; npm fails if it is forced on for a private one. No --provenance flag,
      # which would override this.
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: npm publish --access public
