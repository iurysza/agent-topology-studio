name: Release Please

# Opens or updates the release pull request on each push to main. Merging that pull request makes the vX.Y.Z tag and
# GitHub release. Off unless the repository variable RELEASE_PLEASE_ENABLED is 'true' and this is the intended
# repository. npm publishing has its own switch in release.yml. See reference/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: vars.RELEASE_PLEASE_ENABLED == 'true' && github.repository == 'iurysza/agent-topology-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Prefer a personal access token: a release made with GITHUB_TOKEN does not start release.yml or CI on the
      # release pull request. Without RELEASE_PLEASE_TOKEN it falls back to GITHUB_TOKEN.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
